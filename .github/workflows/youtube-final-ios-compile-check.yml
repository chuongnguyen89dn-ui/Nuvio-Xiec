name: YouTube Final iOS Compile Check
on:
  push:
    branches: [youtube-from-137]
    paths: ['.github/workflows/youtube-final-ios-compile-check.yml']
  workflow_dispatch:
jobs:
  final-check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: touch local.properties
      - name: Verify final YouTube integration
        run: |
          grep -Fq 'PRODUCT_NAME=Nuvio' iosApp/Configuration/Config.xcconfig
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER=com.nuvio.app.Nuvio' iosApp/Configuration/Config.xcconfig
          ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon --stacktrace
