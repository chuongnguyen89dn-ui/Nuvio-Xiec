name: YouTube Final Source Check
on:
  push:
    branches: [youtube-from-137]
    paths: ['.github/workflows/youtube-final-source-check.yml']
  workflow_dispatch:
jobs:
  final-check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: touch local.properties
      - name: Verify final YouTube integration
        run: |
          grep -Fq 'YouTubeBottomBar' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeScreen.kt
          grep -Fq 'onChannelClick' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeScreen.kt
          grep -Fq 'loadChannels' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeRoute.kt
          ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon --stacktrace
