name: YouTube Addon Refresh Check
on:
  push:
    branches: [youtube-from-137]
    paths: ['.github/workflows/youtube-ui-addon-refresh-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: touch local.properties
      - name: Verify isolated feature
        run: |
          grep -Fq 'forceRefresh = retry > 0' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/*.kt
          grep -Fq 'AddonRepository.initialize()' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/*.kt
          ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon --stacktrace
