name: YouTube Core Check

on:
  push:
    branches: [youtube-from-137]
    paths:
      - '.github/workflows/youtube-core-check.yml'
  workflow_dispatch:

# verified workflow revision: core-swift5-v2

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned SmartTube source
        run: |
          test "$(git -C vendor/SmartTubeIOS rev-parse HEAD)" = "bb724e28cb05cca7e7da95c5b2e8d657ccc7ee03"
      - name: Compile SmartTubeIOSCore only with Nuvio-compatible Swift mode
        run: |
          cd vendor/SmartTubeIOS/SmartTubeIOS
          sed -i '' 's|// swift-tools-version:6.0|// swift-tools-version:5.10|' Package.swift
          sed -i '' '/swiftLanguageMode/d' Package.swift
          if grep -q 'swiftLanguageMode' Package.swift; then
            echo "Swift 6 language mode still present"
            exit 1
          fi
          swift build --target SmartTubeIOSCore
