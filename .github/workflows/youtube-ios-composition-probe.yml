name: YouTube MPV Separate A/V Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-ios-composition-probe.yml'

permissions:
  contents: read

jobs:
  mpv-separate-av:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install mpv and ffmpeg
        run: brew install mpv ffmpeg

      - name: Fetch public test media
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o source.mp4 "https://media.w3.org/2010/05/sintel/trailer.mp4"
          ffmpeg -y -i source.mp4 -an -c:v copy video-only.mp4
          ffmpeg -y -i source.mp4 -vn -c:a copy audio-only.m4a
          test -s video-only.mp4
          test -s audio-only.m4a
          ffprobe -v error -show_entries stream=codec_type,codec_name -of compact video-only.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name -of compact audio-only.m4a

      - name: Probe separate video + audio on one mpv timeline
        shell: bash
        run: |
          set -euxo pipefail
          # libmpv/mpv mechanism intended for the isolated YouTube Profile:
          # main video plus external audio, both controlled by one playback timeline.
          mpv video-only.mp4             --audio-file=audio-only.m4a             --no-config --vo=null --ao=null             --start=10 --length=3             --msg-level=all=warn,cplayer=info             --log-file=mpv-probe.log
          grep -E "Video:|Audio:|AV:|Exiting" mpv-probe.log || true
          ! grep -E "Exiting.*Error|Failed to open|No video or audio streams selected" mpv-probe.log

      - name: Verify Nuvio MPVKit branch resolves on macOS
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch Nuvio https://github.com/NuvioMedia/MPVKit.git MPVKit
          cd MPVKit
          swift package resolve
          swift package describe >/tmp/mpvkit-package.txt
          grep -q "Name: MPVKit" /tmp/mpvkit-package.txt
          echo "PASS: MPVKit package resolves; separate A/V mpv probe completed"
