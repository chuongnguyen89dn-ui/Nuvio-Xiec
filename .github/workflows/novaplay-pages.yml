name: NovaPlay static Pages
on:
  push:
    branches: [main]
    paths:
      - 'novaplay-pwa/**'
      - '.github/workflows/novaplay-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: novaplay-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check source JavaScript syntax
        run: node --check novaplay-pwa/source-adapters.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: novaplay-pwa
      - id: deployment
        uses: actions/deploy-pages@v4
