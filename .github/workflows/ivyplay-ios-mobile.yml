name: IvyPlay iOS Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - ivyplay-ios-0.4.20-base
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - '.github/workflows/ivyplay-ios-mobile.yml'

permissions:
  contents: read

jobs:
  build-ivyplay-ios:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NUVIO_IOS_DISTRIBUTION: appstore
      GRADLE_OPTS: -Xmx8g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m
      KOTLIN_DAEMON_JVMARGS: -Xmx6g
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure IvyPlay Nuvio Cloud account sync
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          NUVIO_SUPABASE_FALLBACK_URL=
          EOF
      - name: Fetch player dependency
        run: |
          git clone --depth 1 --branch Nuvio https://github.com/NuvioMedia/MPVKit.git MPVKit
          test -f MPVKit/Package.swift
      - name: Verify IvyPlay identity before build
        shell: bash
        run: |
          grep -q 'com.ivyplay.iphone;' iosApp/iosApp.xcodeproj/project.pbxproj
          grep -q 'com.ivyplay.iphone.DownloadsWidgetExtension;' iosApp/iosApp.xcodeproj/project.pbxproj
          grep -q '<string>IvyPlay</string>' iosApp/iosApp/Info.plist
          grep -q '<string>ivyplay</string>' iosApp/iosApp/Info.plist
          grep -q '<string>stremio</string>' iosApp/iosApp/Info.plist
          grep -q 'MARKETING_VERSION=0.4.20' iosApp/Configuration/Version.xcconfig
      - name: Build IvyPlay unsigned iPhone IPA
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-iphone.log
          APP="$(find build/ios-device/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -x 'com.ivyplay.iphone'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -x 'IvyPlay'
          mkdir -p Payload
          cp -R "$APP" Payload/IvyPlay.app
          ditto -c -k --sequesterRsrc --keepParent Payload IvyPlay-unsigned.ipa
      - name: Upload IvyPlay IPA
        uses: actions/upload-artifact@v4
        with:
          name: IvyPlay-iPhone-unsigned-0.4.20
          path: IvyPlay-unsigned.ipa
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IvyPlay-iOS-device-build-log
          path: build-iphone.log
          retention-days: 7
