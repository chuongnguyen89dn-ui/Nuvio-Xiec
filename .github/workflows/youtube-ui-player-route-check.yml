name: YouTube Player Route Check
on:
  push:
    branches: [youtube-from-137]
    paths: ['.github/workflows/youtube-ui-player-route-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: touch local.properties
      - name: Verify isolated block
        run: |
          grep -q 'onVideoClick = onVideoClick' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeRoute.kt
          grep -q 'onVideoClick(video)' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeScreen.kt
          ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon --stacktrace
