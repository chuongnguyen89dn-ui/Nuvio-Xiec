name: YouTube UI Shorts Check
on:
  push:
    branches: [youtube-from-137]
    paths: ['.github/workflows/youtube-ui-shorts-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: touch local.properties
      - name: Verify isolated UI block
        run: |
          grep -q 'YouTubeShortsShelf' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeScreen.kt
          grep -q 'snapshot.shorts' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeChannelScreen.kt
          ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon --stacktrace
