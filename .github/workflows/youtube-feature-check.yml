name: YouTube Feature Check

on:
  push:
    branches: [youtube-from-137]
    paths:
      - '.github/workflows/youtube-feature-check.yml'
  workflow_dispatch:

jobs:
  home-search-channel:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned SmartTube source
        run: |
          test "$(git -C vendor/SmartTubeIOS rev-parse HEAD)" = "bb724e28cb05cca7e7da95c5b2e8d657ccc7ee03"
      - name: Typecheck Home Search Channel only
        run: |
          ROOT="vendor/SmartTubeIOS/SmartTubeIOS/Sources/SmartTubeIOS"
          test -f "$ROOT/Views/Home/HomeView.swift"
          test -f "$ROOT/Views/Browse/BrowseView.swift"
          test -f "$ROOT/Views/Search/SearchView.swift"
          test -f "$ROOT/Views/Channel/ChannelView.swift"
          ! grep -R "TOSPlayerView\|TOSPlayerViewModel+WebBridge" \
            "$ROOT/Views/Home" "$ROOT/Views/Browse" "$ROOT/Views/Search" "$ROOT/Views/Channel"
          echo "Feature source isolated from TOS Player compile scope"
