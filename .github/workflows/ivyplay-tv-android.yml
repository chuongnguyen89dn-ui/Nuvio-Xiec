name: IvyPlayTV Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'androidApp/**'
      - 'composeApp/**'
      - '.github/workflows/ivyplay-tv-android.yml'

permissions:
  contents: read

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure IvyPlay shared services
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          NUVIO_SUPABASE_FALLBACK_URL=
          EOF
      - name: Build IvyPlayTV debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleTvDebug -Pnuvio.android.distribution=full --stacktrace
      - name: Stage IvyPlayTV APK
        shell: bash
        run: |
          APK="$(find androidApp/build/outputs/apk/tv/debug -name '*.apk' -type f | head -1)"
          test -n "$APK"
          cp "$APK" IvyPlayTV.apk
          ls -lh IvyPlayTV.apk
      - name: Upload IvyPlayTV APK
        uses: actions/upload-artifact@v4
        with:
          name: IvyPlayTV-APK
          path: IvyPlayTV.apk
          retention-days: 14
