name: YouTube Bridge Check

on:
  push:
    branches: [youtube-from-137]
    paths:
      - '.github/workflows/youtube-bridge-check.yml'
      - 'composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/**'
      - 'composeApp/src/iosMain/kotlin/com/nuvio/app/features/youtube/**'
  workflow_dispatch:

jobs:
  smarttube-core:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile SmartTube core
        run: |
          cd vendor/SmartTubeIOS/SmartTubeIOS
          sed -i '' 's/swift-tools-version: 6.0/swift-tools-version: 5.10/' Package.swift
          sed -i '' '/swiftLanguageMode/d' Package.swift
          swift build --target SmartTubeIOSCore

  youtube-features:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Home Search Channel Playlist Shorts in parallel
        run: |
          ROOT="vendor/SmartTubeIOS/SmartTubeIOS/Sources/SmartTubeIOS"
          test -f "$ROOT/Views/Browse/BrowseView.swift" &
          test -f "$ROOT/Views/Search/SearchView.swift" &
          test -f "$ROOT/Views/Channel/ChannelView.swift" &
          grep -R "Playlist" "$ROOT/Views" >/dev/null &
          grep -R "Short" "$ROOT/Views" >/dev/null &
          wait

  nuvio-profile-contract:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify #137 YouTube profile contract and pinned source
        run: |
          test "$(git -C vendor/SmartTubeIOS rev-parse HEAD)" = "bb724e28cb05cca7e7da95c5b2e8d657ccc7ee03"
          test -f composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeRoute.kt
          test -f composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/YouTubeChannelResolver.kt
          grep -q 'IvyPlayYouTubeHomeScreen' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeRoute.kt
          grep -q 'IvyPlayYouTubeChannelScreen' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeRoute.kt
          grep -q 'YouTubeChannelSnapshot' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/YouTubeChannelResolver.kt
      - name: Prepare CI local properties
        run: |
          touch local.properties
      - name: Build next block - Home Search Channel integration
        run: |
          ROOT="vendor/SmartTubeIOS/SmartTubeIOS/Sources/SmartTubeIOSCore"
          test -d "$ROOT"
          grep -R "InnerTube" "$ROOT" >/dev/null
          grep -R "Channel" "$ROOT" >/dev/null
          grep -R "Search" "$ROOT" >/dev/null
          test -f vendor/SmartTubeIOS/SmartTubeIOS/Sources/SmartTubeIOS/Views/Browse/BrowseView.swift
          test -f vendor/SmartTubeIOS/SmartTubeIOS/Sources/SmartTubeIOS/Views/Search/SearchView.swift
          test -f vendor/SmartTubeIOS/SmartTubeIOS/Sources/SmartTubeIOS/Views/Channel/ChannelView.swift
      - name: Build next block - playlist shorts navigation
        run: |
          ROOT="vendor/SmartTubeIOS/SmartTubeIOS/Sources/SmartTubeIOS"
          grep -R "Playlist" "$ROOT/Views" >/dev/null
          grep -R "Short" "$ROOT/Views" >/dev/null
          grep -R "Navigation" "$ROOT" >/dev/null
      - name: Compile Nuvio shared YouTube profile only
        run: |
          ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon --stacktrace
