name: YouTube Error State Check
on:
  push:
    branches: [youtube-from-137]
    paths: ['.github/workflows/youtube-ui-error-state-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: touch local.properties
      - name: Verify isolated feature
        run: |
          grep -Fq 'Không tải được dữ liệu từ addon' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/*.kt
          grep -Fq 'Thử lại' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/*.kt
          grep -Fq 'error' composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/*.kt
          ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon --stacktrace
