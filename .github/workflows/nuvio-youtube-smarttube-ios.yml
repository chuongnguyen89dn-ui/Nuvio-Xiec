name: Nuvio YouTube SmartTube iOS

on:
  workflow_dispatch:
  push:
    branches:
      - youtube-smarttube-port

permissions:
  contents: read

jobs:
  build-youtube-profile:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NUVIO_IOS_DISTRIBUTION: appstore
      GRADLE_OPTS: -Xmx8g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m
      KOTLIN_DAEMON_JVMARGS: -Xmx6g
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure Nuvio runtime
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          NUVIO_SUPABASE_FALLBACK_URL=
          EOF

      - name: Fetch Nuvio player dependency
        run: |
          git clone --depth 1 --branch Nuvio https://github.com/NuvioMedia/MPVKit.git MPVKit
          test -f MPVKit/Package.swift

      - name: Fetch pinned SmartTubeIOS source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir SmartTubeIOS
          cd SmartTubeIOS
          git init
          git remote add origin https://github.com/milika/SmartTubeIOS.git
          git fetch --depth 1 origin bb724e28cb05cca7e7da95c5b2e8d657ccc7ee03
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "bb724e28cb05cca7e7da95c5b2e8d657ccc7ee03"
          test -f SmartTubeIOS/Package.swift

      - name: Link upstream SmartTubeIOS package into Nuvio
        shell: bash
        run: |
          python3 iosApp/setup_smarttube_package.py
          grep -q 'SmartTubeIOSCore' iosApp/iosApp.xcodeproj/project.pbxproj
          grep -q '../SmartTubeIOS/SmartTubeIOS' iosApp/iosApp.xcodeproj/project.pbxproj

      - name: Install official MobileVLCKit
        shell: bash
        run: |
          set -euxo pipefail
          sudo gem install cocoapods --no-document
          cat > iosApp/Podfile <<'RUBY'
          source 'https://github.com/CocoaPods/Specs.git'
          platform :ios, '17.0'
          target 'iosApp' do
            pod 'MobileVLCKit', '3.7.3'
          end
          RUBY
          cd iosApp
          pod install

      - name: Build Nuvio with upstream SmartTube YouTube profile
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-youtube-smarttube.log
          APP="$(find build/ios-device/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.nuvio.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Nuvio-YouTube-SmartTube-unsigned.ipa
          shasum -a 256 Nuvio-YouTube-SmartTube-unsigned.ipa > Nuvio-YouTube-SmartTube-unsigned.ipa.sha256

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-YouTube-SmartTube-unsigned
          path: |
            Nuvio-YouTube-SmartTube-unsigned.ipa
            Nuvio-YouTube-SmartTube-unsigned.ipa.sha256
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-YouTube-SmartTube-build-log
          path: build-youtube-smarttube.log
          retention-days: 7
