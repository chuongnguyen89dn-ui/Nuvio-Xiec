name: NUVIO iOS — YouTube Profile TEST

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/**'
      - '.github/workflows/nuvio-youtube-profile-ios.yml'

permissions:
  contents: read

jobs:
  youtube-profile-ios:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NUVIO_IOS_DISTRIBUTION: appstore
      GRADLE_OPTS: -Xmx8g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m
      KOTLIN_DAEMON_JVMARGS: -Xmx6g
    steps:
      - uses: actions/checkout@v4
      - name: Verify YouTube Profile scope
        shell: bash
        run: |
          echo "YouTube Profile isolated build — source scope: features/youtube"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Nuvio Cloud account sync
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          NUVIO_SUPABASE_FALLBACK_URL=
          EOF
      - name: Fetch original Nuvio player dependency
        run: |
          git clone --depth 1 --branch Nuvio https://github.com/NuvioMedia/MPVKit.git MPVKit
          test -f MPVKit/Package.swift
      - name: Install official MobileVLCKit
        shell: bash
        run: |
          set -euxo pipefail
          sudo gem install cocoapods --no-document
          cat > iosApp/Podfile <<'RUBY'
          source 'https://github.com/CocoaPods/Specs.git'
          platform :ios, '16.1'
          target 'iosApp' do
            pod 'MobileVLCKit', '3.7.3'
          end
          RUBY
          cd iosApp
          pod install
      - name: Compile YouTube Profile integration for Nuvio iPhone
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/youtube-profile-ios CODE_SIGNING_ALLOWED=NO build 2>&1 | tee youtube-profile-build.log
          APP="$(find build/youtube-profile-ios/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.nuvio.app"
          printf 'scope=YouTube Profile TEST\ncommit=%s\nrun_id=%s\nbundle_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$BUNDLE_ID" > YouTube-Profile-build-identity.txt
      - name: Upload YouTube Profile test build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Profile-iOS-TEST-build-log
          path: |
            youtube-profile-build.log
            YouTube-Profile-build-identity.txt
          retention-days: 7
