name: YouTube Integration Addon Player
on:
  push:
    branches: [youtube-from-137]
    paths: ['.github/workflows/youtube-integration-addon-player.yml']
  workflow_dispatch:
jobs:
  integration:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: touch local.properties
      - name: Verify integration sources
        run: |
          test -f composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeAddonRepository.kt
          test -f composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/YouTubeChannelResolver.kt
          test -f composeApp/src/commonMain/kotlin/com/nuvio/app/features/youtube/IvyPlayYouTubeHomeRoute.kt
          ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon --stacktrace
