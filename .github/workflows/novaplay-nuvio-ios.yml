name: IvyPlay iOS Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - ivyplay-mobile
    tags:
      - 'ivyplay-ios-v*'
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - '.github/workflows/novaplay-nuvio-ios.yml'

permissions:
  contents: read

jobs:
  ivyplay-mobile:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NUVIO_IOS_DISTRIBUTION: appstore
      GRADLE_OPTS: -Xmx8g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m
      KOTLIN_DAEMON_JVMARGS: -Xmx6g
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure account sync
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          NUVIO_SUPABASE_FALLBACK_URL=
          EOF
      - name: Fetch MPVKit
        run: |
          git clone --depth 1 --branch Nuvio https://github.com/NuvioMedia/MPVKit.git MPVKit
          test -f MPVKit/Package.swift
      - name: Build IvyPlay unsigned iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-iphone.log
          APP="$(find build/ios-device/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          echo "bundle=$BUNDLE_ID name=$DISPLAY_NAME version=$VERSION"
          test "$BUNDLE_ID" = "com.ivyplay.iphone"
          test "$DISPLAY_NAME" = "IvyPlay"
          test "$VERSION" = "0.4.20"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload IvyPlay-unsigned.ipa
      - name: Upload IvyPlay IPA
        uses: actions/upload-artifact@v4
        with:
          name: IvyPlay-iPhone-unsigned
          path: |
            IvyPlay-unsigned.ipa
            build-iphone.log
          retention-days: 7
      - name: Stage versioned release
        if: startsWith(github.ref, 'refs/tags/ivyplay-ios-v')
        run: |
          shasum -a 256 IvyPlay-unsigned.ipa > IvyPlay-unsigned.ipa.sha256
      - name: Publish IvyPlay iOS release
        if: startsWith(github.ref, 'refs/tags/ivyplay-ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" IvyPlay-unsigned.ipa IvyPlay-unsigned.ipa.sha256 \
            --title "IvyPlay iOS ${GITHUB_REF_NAME}" --generate-notes --verify-tag
