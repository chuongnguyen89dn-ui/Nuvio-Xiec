name: Nuvio iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'ivyplay-ios-v*'
    paths:
      - 'composeApp/**'
      - 'iosApp/**'
      - '.github/workflows/novaplay-nuvio-ios.yml'

permissions:
  contents: read

jobs:
  original-nuvio:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NUVIO_IOS_DISTRIBUTION: appstore
      GRADLE_OPTS: -Xmx8g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m
      KOTLIN_DAEMON_JVMARGS: -Xmx6g
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Nuvio Cloud account sync
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          NUVIO_SUPABASE_FALLBACK_URL=
          EOF
      - name: Fetch original Nuvio player dependency
        run: |
          git clone --depth 1 --branch Nuvio https://github.com/NuvioMedia/MPVKit.git MPVKit
          test -f MPVKit/Package.swift
      - name: Install official MobileVLCKit
        shell: bash
        run: |
          set -euxo pipefail
          sudo gem install cocoapods --no-document
          cat > iosApp/Podfile <<'RUBY'
          source 'https://github.com/CocoaPods/Specs.git'
          platform :ios, '16.1'
          target 'iosApp' do
            pod 'MobileVLCKit', '3.7.3'
          end
          RUBY
          cd iosApp
          pod install

      - name: Compile Nuvio iPhone app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-iphone.log
          APP="$(find build/ios-device/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.nuvio.app"
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "bundle_id=$BUNDLE_ID"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Info.plist"
          } > Nuvio-build-identity.txt
      - name: Package unsigned IPA on manual or release build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ivyplay-ios-v')
        shell: bash
        run: |
          APP="$(find build/ios-device/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Nuvio-unsigned.ipa
      - name: Upload unsigned IPA on manual or release build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ivyplay-ios-v')
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iPhone-unsigned
          path: |
            Nuvio-unsigned.ipa
            Nuvio-build-identity.txt
          retention-days: 7
      - name: Upload iPhone build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-device-build-log
          path: build-iphone.log
          retention-days: 7
      - name: Persist latest iOS build status for automatic follow-up
        if: always()
        shell: bash
        run: |
          mkdir -p ci-status
          cp build-iphone.log ci-status/ios-latest.log 2>/dev/null || true
          {
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "job_status=$JOB_STATUS"
            echo "updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-status/ios-latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/ios-latest.log ci-status/ios-latest.txt
          git commit -m "ci(status): record latest iOS build result [skip ci]" || exit 0
          # ci-status is best-effort bookkeeping only. A concurrent main update must never
          # turn a successfully built/uploaded IPA into a failed workflow.
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "Skipping ci-status persistence because main changed concurrently."
            exit 0
          fi
          if ! git push origin HEAD:main; then
            echo "Skipping ci-status persistence because main changed before push."
            exit 0
          fi
        env:
          JOB_STATUS: ${{ job.status }}
      - name: Stage IvyPlay IPA for versioned releases
        if: startsWith(github.ref, 'refs/tags/ivyplay-ios-v')
        run: |
          cp Nuvio-unsigned.ipa IvyPlay-unsigned.ipa
          shasum -a 256 IvyPlay-unsigned.ipa > IvyPlay-unsigned.ipa.sha256
      - name: Publish IvyPlay iOS release
        if: startsWith(github.ref, 'refs/tags/ivyplay-ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" IvyPlay-unsigned.ipa IvyPlay-unsigned.ipa.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" IvyPlay-unsigned.ipa IvyPlay-unsigned.ipa.sha256 \
              --title "IvyPlay iOS ${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
